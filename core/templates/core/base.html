
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>{% block title %}ReviewBoost{% endblock %}</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link href="https://unpkg.com/aos@2.3.1/dist/aos.css" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

/* ── NeXDPTech brand theme (navy + orange, matches the logo) ── */
:root{
    --navy:#003e6c;
    --navy-dark:#00294c;
    --navy-light:#e6eef4;

    --gold:#fe6101;
    --gold-light:#ffe8d6;
    --gold-dark:#d94e00;

    --ink:#0f0e0d;
    --ink2:#3a3733;
    --ink3:#7a7672;

    --paper:#faf9f7;
    --paper2:#f3f1ed;
    --paper3:#e5e0d8;

    --green:#1a6b3c;
    --green-light:#d4edde;

    --danger:#c0392b;
    --danger-light:#fbeaea;

    --radius:22px;
    --radius-sm:12px;

    --shadow-lg:0 20px 55px rgba(15,25,40,.08);
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:'Inter',sans-serif;
    background:
    radial-gradient(circle at top left, rgba(254,97,1,.08), transparent 28%),
    radial-gradient(circle at bottom right, rgba(0,62,108,.06), transparent 28%),
    var(--paper);

    color:var(--ink);
    min-height:100vh;
    overflow-x:hidden;
}

a{
    text-decoration:none;
    color:inherit;
}

img{
    max-width:100%;
    display:block;
}

button{
    border:none;
    cursor:pointer;
    font-family:inherit;
}

.container{
    width:min(1180px,92%);
    margin:auto;
}

.nav{
    position:sticky;
    top:0;
    z-index:999;
    backdrop-filter:blur(20px);
    background:rgba(250,249,247,.86);
    border-bottom:1px solid var(--paper3);
}

.nav-inner{
    height:78px;
    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    display:flex;
    align-items:center;
    gap:.5rem;
    font-size:1.5rem;
    font-weight:800;
    letter-spacing:-1px;
    color:var(--navy);
}

.logo-img{
    height:34px;
    width:auto;
    object-fit:contain;
    display:block;
}

.logo-text{
    display:none;
}

.logo span{
    color:var(--gold);
}

.nav-links{
    display:flex;
    align-items:center;
    gap:28px;
}

.nav-links a{
    color:var(--ink2);
    font-size:.95rem;
    transition:.25s;
}

.nav-links a:hover{
    color:var(--navy);
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;

    padding:.95rem 1.45rem;

    border-radius:16px;

    font-size:.95rem;
    font-weight:600;

    transition:.28s;
}

.btn-primary{
    background:var(--navy);
    color:white;

    box-shadow:
    0 10px 30px rgba(0,62,108,.25);
}

.btn-primary:hover{
    background:var(--navy-dark);
    transform:translateY(-3px);
}

.btn-outline{
    border:1px solid var(--paper3);
    background:#fff;
    color:var(--ink2);
}

.btn-outline:hover{
    background:var(--paper2);
}

.btn-gold{
    background:var(--navy);
    color:#fff;
}

.btn-gold:hover{
    background:var(--navy-dark);
}

.card{
    background:#fff;

    border:1px solid var(--paper3);

    box-shadow:var(--shadow-lg);

    border-radius:var(--radius);
}

input,
select,
textarea{
    width:100%;

    padding:1rem 1rem;

    border-radius:16px;

    border:1px solid var(--paper3);

    background:#fff;

    color:var(--ink);

    outline:none;

    font-size:.95rem;
}

input:focus,
select:focus,
textarea:focus{
    border-color:var(--gold);
}

input::placeholder,
textarea::placeholder{
    color:#a6a29b;
}

label{
    display:block;
    margin-bottom:.55rem;

    color:var(--ink2);

    font-size:.9rem;
    font-weight:500;
}

.form-group{
    margin-bottom:1.2rem;
}

.badge,
.badge-gold{
    display:inline-flex;
    align-items:center;
    justify-content:center;

    padding:.45rem .9rem;

    border-radius:999px;

    background:var(--gold-light);

    color:var(--gold-dark);

    font-size:.78rem;
    font-weight:600;
}

.section-title{
    font-size:3rem;
    line-height:1.05;

    font-weight:800;

    letter-spacing:-2px;
    color:var(--ink);
}

.section-sub{
    color:var(--ink3);

    line-height:1.8;
}

.msg-error{
    padding:14px;

    background:var(--danger-light);

    border:1px solid rgba(192,57,43,.25);

    border-radius:16px;

    color:var(--danger);

    margin-bottom:18px;
}

footer{
    border-top:1px solid var(--paper3);

    margin-top:90px;

    padding:34px 0;

    text-align:center;

    color:var(--ink3);
}

::-webkit-scrollbar{
    width:8px;
}

::-webkit-scrollbar-thumb{
    background:var(--paper3);
    border-radius:20px;
}

@media(max-width:900px){

    .nav-links{
        gap:16px;
    }

    .section-title{
        font-size:2.3rem;
    }

}

@media(max-width:700px){

    .nav-inner{
        height:70px;
    }

    .nav-links a{
        font-size:.88rem;
    }

    .btn{
        padding:.85rem 1.2rem;
    }

}

</style>

{% block extra_css %}{% endblock %}

</head>

<body>

<nav class="nav">

<div class="container nav-inner">

<a href="/" class="logo">
<img src="{% static 'core/img/logo.png' %}" alt="ReviewBoost" class="logo-img"
     onerror="this.style.display='none';this.nextElementSibling.style.display='inline'">
<span class="logo-text">Review<span>Boost</span></span>
</a>

<div class="nav-links">

{% if user.is_authenticated %}

<a href="/dashboard/">Dashboard</a>

<a href="/logout/" class="btn btn-outline">
Logout
</a>

{% else %}

<a href="/login/">Login</a>

<a href="/signup/" class="btn btn-primary">
Get Started
</a>

{% endif %}

</div>

</div>

</nav>

{% block content %}{% endblock %}

<footer>
© 2026 ReviewBoost — AI Powered Review Growth Platform
</footer>

<script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>

<script>
AOS.init({
    duration:700,
    once:true
})
</script>

</body>
</html>
